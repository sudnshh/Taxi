<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>واجهة الكابتن</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header><h1>🚕 تكسي وين</h1><div>واجهة الكابتن</div></header><main><section class="panel"><h2>🚗 طلبات المشاوير</h2><p class="hint">الطلبات التجريبية اللي انعملت من نفس المتصفح فقط.</p><div id="rides"></div><button class="secondary" onclick="render()">تحديث الطلبات</button></section><a href="index.html">الرئيسية</a></main><script>
function render(){const rides=JSON.parse(localStorage.getItem('taxiWaynRides')||'[]');document.getElementById('rides').innerHTML=rides.length?'':'ماكو طلبات بعد';rides.forEach(r=>{const d=document.createElement('div');d.className='panel';const t=document.createElement('p');t.textContent='الزبون: '+r.name+' | الحالة: '+r.status+' | المسافة: '+(r.distanceKm??'غير محسوبة')+' كم | السعر التقديري: '+(r.estimatedFare!=null?r.estimatedFare.toLocaleString('en-US')+' د.ع':'غير متوفر');d.append(t);const link=document.createElement('a');link.href='https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route='+r.pickup.lat+'%2C'+r.pickup.lng+'%3B'+r.destination.lat+'%2C'+r.destination.lng;link.target='_blank';link.rel='noopener';link.textContent='🗺️ افتح الطريق';d.append(link);for(const [label,status] of [['قبول الطلب','مقبول'],['إنهاء الرحلة','مكتمل']]){const btn=document.createElement('button');btn.textContent=label;btn.onclick=()=>{r.status=status;localStorage.setItem('taxiWaynRides',JSON.stringify(rides));render()};d.append(btn)}document.getElementById('rides').append(d)})}render();</script></body></html>
