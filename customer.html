<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>واجهة الزبون</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body hidden><header><h1>🚕 تكسي وين</h1><div>واجهة الزبون</div><div id="userbar"></div></header><main><section class="panel"><h2>وين تريد تروح؟ 🇮🇶</h2><p>اضغط على الخريطة حتى تحدد مكان الانطلاق، وبعدها اضغط مرة ثانية حتى تحدد الوجهة.</p><div id="map"></div><p id="status">📍 اختار مكان الانطلاق</p><button class="secondary" id="locate">📍 موقعي الحالي</button><button class="secondary" id="reset">🔄 إعادة التحديد</button></section><section class="panel"><div class="fare" id="fare">💰 حدد مكان الانطلاق والوجهة حتى نحسب السعر</div><p id="summary">ما محدد مواقع بعد</p><button id="book">🚕 اطلب تكسي</button><p id="message"></p></section><section class="panel"><h2>📋 رحلاتي</h2><div id="mine"></div></section><nav><a href="index.html">الرئيسية</a></nav></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script><script src="auth.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(async()=>{
const me=await Auth.guard('customer');if(!me)return;
const map=L.map('map').setView([33.3,44.4],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
let pickup=null,destination=null,a=null,b=null,line=null,routeKm=null,estimatedFare=null,routeController=null;const status=document.getElementById('status'),summary=document.getElementById('summary');
function setPoint(latlng){if(!pickup){pickup=latlng;a=L.marker(latlng).addTo(map).bindPopup('📍 مكان الانطلاق').openPopup();status.textContent='🏁 هسه اختار الوجهة';}else if(!destination){destination=latlng;b=L.marker(latlng).addTo(map).bindPopup('🏁 الوجهة').openPopup();status.textContent='⏳ دا نحسب مسافة الطريق...';calculateRoute();}else{status.textContent='اضغط إعادة التحديد حتى تغير المواقع';}summary.textContent=pickup&&destination?'📍 الانطلاق: '+pickup.lat.toFixed(5)+', '+pickup.lng.toFixed(5)+' | 🏁 الوجهة: '+destination.lat.toFixed(5)+', '+destination.lng.toFixed(5):'بعدك ما حددت المكانين';}
async function calculateRoute(){
 const from=pickup,to=destination;routeKm=null;estimatedFare=null;
 document.getElementById('fare').textContent='⏳ دا نحسب المسافة والسعر التقديري...';
 document.getElementById('book').disabled=true;
 if(routeController)routeController.abort();routeController=new AbortController();
 try{
  const url=`https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`;
  const response=await fetch(url,{signal:routeController.signal});if(!response.ok)throw Error('routing');
  const data=await response.json();if(!data.routes?.length)throw Error('no route');
  if(pickup!==from||destination!==to)return;
  const route=data.routes[0];routeKm=route.distance/1000;estimatedFare=Math.round((2000+routeKm*300)/250)*250;
  if(line)map.removeLayer(line);
  line=L.geoJSON(route.geometry,{style:{color:'#171717',weight:5}}).addTo(map);
  map.fitBounds(line.getBounds(),{padding:[35,35]});
  document.getElementById('fare').textContent=`💰 السعر التقديري: ${estimatedFare.toLocaleString('en-US')} د.ع | المسافة: ${routeKm.toFixed(1)} كم`;
  status.textContent='✅ الطريق والسعر جاهزين';document.getElementById('book').disabled=false;
 }catch(e){if(e.name==='AbortError')return;document.getElementById('fare').textContent='⚠️ ما كدرنا نحسب مسافة الطريق حالياً. جرّب تعيد التحديد.';status.textContent='تعذر حساب المسار';}
}
map.on('click',e=>setPoint(e.latlng));document.getElementById('reset').onclick=()=>{for(const x of [a,b,line])if(x)map.removeLayer(x);pickup=destination=a=b=line=null;routeKm=estimatedFare=null;if(routeController)routeController.abort();document.getElementById('book').disabled=false;document.getElementById('fare').textContent='💰 حدد مكان الانطلاق والوجهة حتى نحسب السعر';status.textContent='📍 اختار مكان الانطلاق';summary.textContent='ما محدد مواقع بعد';};
document.getElementById('locate').onclick=()=>{if(!navigator.geolocation){status.textContent='الموقع غير مدعوم';return;}navigator.geolocation.getCurrentPosition(pos=>{if(pickup)document.getElementById('reset').click();map.setView([pos.coords.latitude,pos.coords.longitude],15);setPoint(L.latLng(pos.coords.latitude,pos.coords.longitude));},()=>{status.textContent='ما كدرنا نحدد موقعك. تأكد من سماح الموقع أو حدده يدوياً.';},{enableHighAccuracy:true,timeout:12000});};
const msg=document.getElementById('message');
document.getElementById('book').onclick=async()=>{
 if(!pickup||!destination){msg.textContent='حدد الانطلاق والوجهة أولاً';return;}
 if(estimatedFare===null){msg.textContent='انتظر حتى نحسب سعر المشوار';return;}
 const bk=document.getElementById('book');bk.disabled=true;
 try{
  await Auth.addRide({customer_id:me.id,customer_name:me.name,customer_phone:me.phone,pickup_lat:pickup.lat,pickup_lng:pickup.lng,dest_lat:destination.lat,dest_lng:destination.lng,distance_km:Number(routeKm.toFixed(2)),fare:estimatedFare});
  msg.textContent='✅ انرسل طلبك. دا ننتظر كابتن يقبله.';renderMine();
 }catch(e){msg.textContent='⚠️ '+e.message}
 bk.disabled=false;
};
const cls={new:'new',accepted:'ok',completed:'ok',cancelled:'bad'};
async function renderMine(){
 const box=document.getElementById('mine');
 try{
  const list=await Auth.rides();
  if(!list.length){box.textContent='ماكو رحلات بعد';return}
  box.replaceChildren(...list.map(r=>{
   const d=document.createElement('div');d.className='row';
   const s=document.createElement('span');s.className='badge '+(cls[r.status]||'');s.textContent=Auth.STATUS_AR[r.status]||r.status;
   const t=document.createElement('span');t.textContent=' '+(r.fare!=null?r.fare.toLocaleString('en-US')+' د.ع':'')+' — '+(r.distance_km??'?')+' كم'+(r.driver_name?' — الكابتن: '+r.driver_name+' ('+r.driver_car+' / '+r.driver_plate+')':'');
   d.append(s,t);
   if(r.status==='new'){const c=document.createElement('button');c.className='secondary';c.textContent='إلغاء';c.onclick=async()=>{try{await Auth.rpc('cancel_ride',r.id)}catch(e){msg.textContent='⚠️ '+e.message}renderMine()};d.append(c)}
   return d;
  }));
 }catch(e){box.textContent='⚠️ '+e.message}
}
renderMine();setInterval(renderMine,5000);
})();
</script></body></html>
