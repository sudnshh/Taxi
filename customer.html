<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>واجهة الزبون</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header><h1>🚕 تكسي وين</h1><div>واجهة الزبون</div></header><main><section class="panel"><h2>وين تريد تروح؟ 🇮🇶</h2><p>اضغط على الخريطة حتى تحدد مكان الانطلاق، وبعدها اضغط مرة ثانية حتى تحدد الوجهة.</p><div id="map"></div><p id="status">📍 اختار مكان الانطلاق</p><button class="secondary" id="locate">📍 موقعي الحالي</button><button class="secondary" id="reset">🔄 إعادة التحديد</button></section><section class="panel"><label>اسم الزبون<input id="name" placeholder="اسمك"></label><label>رقم الموبايل (اختياري للتجربة)<input id="phone" type="tel" placeholder="07xxxxxxxxx"></label><p id="summary">ما محدد مواقع بعد</p><button id="book">🚕 اطلب تكسي</button><p id="message"></p><small>نسخة تجريبية: ماكو ربط حقيقي بين أجهزة الزبون والكابتن. بيانات الرحلة محفوظة بهذا المتصفح فقط.</small></section><nav><a href="index.html">الرئيسية</a></nav></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([33.3,44.4],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
let pickup=null,destination=null,a=null,b=null,line=null;const status=document.getElementById('status'),summary=document.getElementById('summary');
function setPoint(latlng){if(!pickup){pickup=latlng;a=L.marker(latlng).addTo(map).bindPopup('📍 مكان الانطلاق').openPopup();status.textContent='🏁 هسه اختار الوجهة';}else if(!destination){destination=latlng;b=L.marker(latlng).addTo(map).bindPopup('🏁 الوجهة').openPopup();line=L.polyline([pickup,destination],{color:'#161616',dashArray:'7,8'}).addTo(map);map.fitBounds(line.getBounds(),{padding:[40,40]});status.textContent='✅ حددت المكانين';}else{status.textContent='اضغط إعادة التحديد حتى تغير المواقع';}summary.textContent=pickup&&destination?'📍 الانطلاق: '+pickup.lat.toFixed(5)+', '+pickup.lng.toFixed(5)+' | 🏁 الوجهة: '+destination.lat.toFixed(5)+', '+destination.lng.toFixed(5):'بعدك ما حددت المكانين';}
map.on('click',e=>setPoint(e.latlng));document.getElementById('reset').onclick=()=>{for(const x of [a,b,line])if(x)map.removeLayer(x);pickup=destination=a=b=line=null;status.textContent='📍 اختار مكان الانطلاق';summary.textContent='ما محدد مواقع بعد';};
document.getElementById('locate').onclick=()=>{if(!navigator.geolocation){status.textContent='الموقع غير مدعوم';return;}navigator.geolocation.getCurrentPosition(pos=>{if(pickup)document.getElementById('reset').click();map.setView([pos.coords.latitude,pos.coords.longitude],15);setPoint(L.latLng(pos.coords.latitude,pos.coords.longitude));},()=>{status.textContent='ما كدرنا نحدد موقعك. تأكد من سماح الموقع أو حدده يدوياً.';},{enableHighAccuracy:true,timeout:12000});};
document.getElementById('book').onclick=()=>{if(!pickup||!destination){document.getElementById('message').textContent='حدد الانطلاق والوجهة أولاً';return;}const name=document.getElementById('name').value.trim();if(!name){document.getElementById('message').textContent='اكتب اسمك';return;}const rides=JSON.parse(localStorage.getItem('taxiWaynRides')||'[]');rides.unshift({id:Date.now(),name,phone:document.getElementById('phone').value,pickup,destination,status:'جديد'});localStorage.setItem('taxiWaynRides',JSON.stringify(rides));document.getElementById('message').textContent='✅ انحفظ طلبك التجريبي بهذا الجهاز. حتى توصله للسواق بأجهزة ثانية نحتاج قاعدة بيانات.';};
</script></body></html>
