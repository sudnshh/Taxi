<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المدير</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header><h1>🚕 تكسي وين</h1><div>لوحة المدير</div></header><main><section class="panel"><h2>📊 لوحة المدير التجريبية</h2><p id="stats"></p><div id="rides"></div><button class="secondary" onclick="render()">تحديث</button><p class="hint">تنبيه: هذه الصفحة غير محمية بتسجيل دخول. لا تستخدمها لإدارة بيانات حقيقية قبل إضافة مصادقة وصلاحيات.</p></section><a href="index.html">الرئيسية</a></main><script>function render(){const r=JSON.parse(localStorage.getItem('taxiWaynRides')||'[]');document.getElementById('stats').textContent='مجموع الطلبات: '+r.length+' | الجديدة: '+r.filter(x=>x.status==='جديد').length+' | المكتملة: '+r.filter(x=>x.status==='مكتمل').length;document.getElementById('rides').replaceChildren(...r.map(x=>{const p=document.createElement('p');p.textContent='#'+x.id+' — '+x.name+' — '+x.status;return p}))}render();</script></body></html>
